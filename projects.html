<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>PROJECTS</title>
</head>
<body>
    <header>
        <img class = "logo" src="./Images/V1.svg" alt="Nooparnjang Logo">
        <nav>
            <ul class = "nav__links">
                <li class="forNav"><a href="./index.html" class = "forNav">About</a></li>
                <li class="forNav"><a href="./projects.html" class = "forNav">Projects</a></li>
                <li class="forNav"><a href="./contacts.html" class = "forNav">Contacts</a></li>
            </ul>
        </nav>
    </header>
    <main class="forAll2 projectGrid" id="projectList"></main>
    <dialog class="projectDialog" id="projectDialog" aria-labelledby="projectDialogTitle" aria-describedby="projectDialogDescription">
        <div class="projectDialogHeader">
            <h2 id="projectDialogTitle"></h2>
            <button class="projectDialogClose" id="projectDialogClose" type="button" aria-label="Close dialog">&times;</button>
        </div>
        <p class="projectDialogDescription" id="projectDialogDescription"></p>
        <div class="projectDialogActions">
            <a class="projectLink projectDialogLink" id="projectDialogLink" target="_blank" rel="noopener noreferrer">Open project</a>
        </div>
    </dialog>

    <script src="script1.js" type="module"></script>
</body>
</html>
